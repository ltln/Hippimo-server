name: Reseed Database

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "reseed" to confirm database reset and seed'
        required: true
        type: string

jobs:
  reseed:
    name: Reseed
    runs-on:
      - self-hosted
      - hippimo-runner
    environment: production

    steps:
      - name: Validate confirmation
        if: ${{ inputs.confirm != 'reseed' }}
        run: |
          echo 'Confirmation failed. Type "reseed" to run this workflow.'
          exit 1

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate .env file
        run: |
          cat > .env <<'EOF'
          NODE_ENV=production
          PORT=${{ secrets.PORT || '8000' }}
          DATABASE_URL=${{ secrets.DATABASE_URL }}
          REDIS_URL=${{ secrets.REDIS_URL }}
          ACCESS_TOKEN_SECRET=${{ secrets.ACCESS_TOKEN_SECRET }}
          ACCESS_TOKEN_EXPIRES_IN=${{ secrets.ACCESS_TOKEN_EXPIRES_IN || '15m' }}
          REFRESH_TOKEN_SECRET=${{ secrets.REFRESH_TOKEN_SECRET }}
          REFRESH_TOKEN_EXPIRES_IN=${{ secrets.REFRESH_TOKEN_EXPIRES_IN || '15d' }}
          GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
          EMAIL_LOGIN_CODE_EXPIRES_IN=${{ secrets.EMAIL_LOGIN_CODE_EXPIRES_IN || '10m' }}
          MAIL_HOST=${{ secrets.MAIL_HOST }}
          MAIL_PORT=${{ secrets.MAIL_PORT || '587' }}
          MAIL_SECURE=${{ secrets.MAIL_SECURE || 'false' }}
          MAIL_USER=${{ secrets.MAIL_USER }}
          MAIL_PASS=${{ secrets.MAIL_PASS }}
          MAIL_FROM=${{ secrets.MAIL_FROM }}
          EOF

      - name: Reset and seed database
        run: npm run db:reset -- --force && npm run db:seed
